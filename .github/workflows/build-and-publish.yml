name: build-and-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: tests (in image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run pytest inside the test stage
        run: docker build --target test -t ai-credit-watch:test .

  privacy-sweep:
    name: privacy sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the sweep scans every commit, so it needs full history
      - name: Scan tree, history and commit metadata for private data
        run: bash dev/privacy-sweep.sh

  publish:
    name: build + push multi-arch
    needs: [test, privacy-sweep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Smoke test the image (amd64, no keys)
        run: |
          docker build --target runtime -t ai-credit-watch:smoke .
          docker run -d --name smoke -p 8000:8000 ai-credit-watch:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/api/providers | head -c 400
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/
          docker rm -f smoke

      # The sweep scans the tree and the history, not the artifact. A stale
      # __pycache__ in the build context bakes absolute host paths into the image,
      # and only this catches it — so the shipped image is scanned too.
      - name: Scan the built image for private data
        run: bash dev/privacy-sweep.sh --image ai-credit-watch:smoke
